<script>// All artwork is rasterized on a logical-pixel grid using solid rectangles.
function paintWorld(canvas, view) {
  const W = 282, H = 296;
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const r = (x,y,w,h,c) => { g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
  function poly(points, c) {
    const min=Math.max(0,Math.floor(Math.min(...points.map(p=>p[1]))));
    const max=Math.min(H, Math.ceil(Math.max(...points.map(p=>p[1]))));
    for(let y=min;y<max;y++) {
      const xs=[];
      points.forEach(([ax,ay],i)=>{
        const [bx,by]=points[(i+1)%points.length], h=y+0.5;
        if ((ay<=h && h<by) || (by<=h && h<ay)) xs.push(ax+(h-ay)*(bx-ax)/(by-ay));
      });
      xs.sort((a,b)=>a-b);
      for(let j=0;j+1<xs.length;j+=2) {
        const a=Math.ceil(xs[j]-0.5), b=Math.ceil(xs[j+1]-0.5);
        if(b>a)r(a,y,b-a,1,c);
      }
    }
  }
  function line(a,b,c,step=1) {
    const n=Math.max(1,Math.ceil(Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]))));

// Small workspace examples use the same section and action names as the game codec.
function geometry(i) {
  const boxes=[];
  const add=(block,from,to)=>boxes.push({block,from,to});
  if(i===0) {
    for(const x of [1,7])for(const z of [1,7])add('main',[x,0,z],[x,8,z]);
    add('deck',[0,9,0],[8,9,8]);
    for(const x of [1,7]){
      add('deck',[x,10,1],[x,11,7]);add('window',[x,12,1],[x,14,7]);
    }
    for(const z of [1,7]){
      add('deck',[1,10,z],[7,11,z]);add('window',[1,12,z],[7,14,z]);
    }
    add('deck',[1,15,1],[7,15,7]);
  }else if(i===1) {
    for(let y=0;y<5;y++)add('main',[y,y,y],[10-y,y,10-y]);
  }else{
    for(let z=0;z<10;z++){
      const y=9-z;
      add('main',[1,y,z],[2,y,z]);add('rail',[3,y+1,z],[3,y+1,z]);
    }
    add('deck',[0,0,10],[3,0,10]);
  }
  const blocks=new Set();
  boxes.forEach(({from,to})=>{
    for(let x=from[0];x<=to[0];x++)for(let y=from[1];y<=to[1];y++)for(let z=from[2];z<=to[2];z++)blocks.add([x,y,z].join(','));
  });
  return {boxes,count:blocks.size};
}
const shapes=files.map((f,i)=>{const g=geometry(i);f.delta=g.count;return g;});
function toml(i) {
  const f=files[i];
  const lines=['format_version = 1','','[workspace]','name = "'+f.part+'"','origin = ['+f.origin.join(', ')+']','size = ['+f.size.join(', ')+']','','[palette]','main = "minecraft:'+f.block+'"'];
  if(i!==1)lines.push('deck = "minecraft:spruce_planks"');
  if(i===0)lines.push('window = "minecraft:glass_pane"');
  if(i===2)lines.push('rail = "minecraft:spruce_fence"');
  lines.push('','[[part]]','name = "'+f.part+'"','priority = 0');
  shapes[i].boxes.forEach(({block,from,to})=>{
    lines.push('','[[part.action]]','type = "box"','block = "'+block+'"','from = ['+from.join(', ')+']','to = ['+to.join(', ')+']');
    if(block==='main'&&i===2)lines.push('facing = "north"');
  });
  return lines.join('\n');
}

function rememberScroll(){if($('scroller'))state.scroll[state.tab]=$('scroller').scrollTop;}
function changeTab(tab){

    const first=files.findIndex((_,i)=>state.saved[i]!==null||state.statuses[i]==='pending');

function select(i){state.selected=i;state.scroll.review=0;state.scroll.files=0;state.fileDrawer=false;}
function protect(next) {
  if(state.editing&&state.editText!==(state.statuses[state.selected]==='pending'?state.proposed[state.selected]:state.saved[state.selected])) {
    ask('放弃未保存的修改？','当前正文里的改动还没有保存。','放弃修改',()=>{state.editing=false;next();});return;

let previousFocus;
function ask(title,description,yes,action){
  previousFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogText').textContent=description;$('confirm').textContent=yes;onConfirm=action;
  $('modal').hidden=false;$('underlay').inert=true;$('cancel').focus();
}
function dismiss(){
  $('modal').hidden=true;$('underlay').inert=false;onConfirm=null;
  if(previousFocus?.isConnected)previousFocus.focus();
}
function send(){
  const text=state.draft.trim();
  if(!text)return;
  state.draft='';
  if(acceptsQueue()){
    state.queue.push(text);state.notice='已加入队列';render('prompt');return;
  }
  if(state.phase==='ready'){
    state.activeNote=text;state.notice='正在处理追加要求';render();return;
  }
  state.prompt=text;state.phase='running';state.notice='开始建造';state.scroll.chat=0;render();
}
function finish(){
  if(!busy())return;
  if(state.activeNote){
    state.handledNotes.push(state.activeNote);state.activeNote='';
    state.notice='追加要求已读';
  }else{
    state.statuses.fill('pending');state.phase='ready';state.notice='3 份文件已就绪';state.scroll.chat=0;
  }
  if(state.queue.length){state.activeNote=state.queue.shift();state.notice='已开始处理队首';}
  render();
}
function decide(status){
  rememberScroll();
  const i=state.selected;
  if(state.statuses[i]!=='pending')return;
  if(status==='applied')state.saved[i]=state.proposed[i];
  state.statuses[i]=status;state.notice=files[i].name+' · '+statusLabel[status];
  const next=[1,2,3].map(d=>(i+d)%3).find(j=>state.statuses[j]==='pending');
  if(next!==undefined)select(next);
  render();
}
function act(action){
  if(!$('modal').hidden)return;
  const [a,v]=action.split(':');
  if(a==='tab') {
    if(state.tab!==v)protect(()=>changeTab(v));
  }else if(a==='pick') {select(+v);changeTab('review');}
  else if(a==='file')protect(()=>{select(+v);render();});
  else if(a==='tree'){state.fileDrawer=!state.fileDrawer;render();}
  else if(a==='firstReview'){const i=state.statuses.indexOf('pending');select(Math.max(0,i));changeTab('review');}
  else if(a==='inspectFile')changeTab('files');
  else if(a==='stop'){if(state.activeNote)state.notePaused=true;else state.phase='stopped';state.notice='已停止当前运行';render();}
  else if(a==='resume'){if(state.activeNote)state.notePaused=false;else state.phase='running';state.notice='重新运行';render();}
  else if(a==='send')send();
  else if(a==='apply')decide('applied');
  else if(a==='discard')ask('丢弃 '+files[state.selected].key+'？','这份提案的预览会撤下。其他文件仍可继续审阅。','丢弃此文件',()=>decide('discarded'));
  else if(a==='edit'){state.editing=true;state.editText=state.statuses[state.selected]==='pending'?state.proposed[state.selected]:state.saved[state.selected];render('editor');}
  else if(a==='save'){
    const i=state.selected;
    if(!state.editText.trim()){state.notice='正文为空，请补全后保存';render('editor');return;}
    state.proposed[i]=state.editText;state.statuses[i]='pending';state.phase='ready';state.manual.add(i);state.editing=false;state.tab='review';state.notice='手改已存为待审';render();
  }
  else if(a==='cancelEdit')protect(()=>render());
  else if(a==='theme')cycleTheme();
  else if(a==='preview'){state.preview=!state.preview;world();}
  else if(a==='open'){state.closed=false;render();}
}
function back(){
  if(!$('modal').hidden){dismiss();return;}
  if(state.closed)return;
  if(state.editing){act('cancelEdit');return;}
  if(state.fileDrawer){state.fileDrawer=false;render();return;}
  if(document.activeElement===$('prompt')){document.activeElement.blur();return;}
  if(state.tab!=='chat'){changeTab('chat');return;}
  state.closed=true;render();$('hotkeys').querySelector('button')?.focus();
}

  $('frame').style.width=w*scale+'px';$('frame').style.height=h*scale+'px';
  $('sheet').style.width=w*scale+'px';$('dimensions').textContent=w+' × '+h+'  /  '+Number(scale.toFixed(2))+'×';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act);});
document.addEventListener('input',e=>{

document.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(!$('modal').hidden){
    if(e.key==='Escape'){e.preventDefault();dismiss();}
    if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('cancel')?$('confirm'):$('cancel')).focus();}return;
  }
  if(e.key==='Escape'){e.preventDefault();back();return;}
  if(state.closed){if(e.code==='KeyO'){e.preventDefault();act('open');}return;}
  if(e.altKey&&['1','2','3'].includes(e.key)){e.preventDefault();act('tab:'+['chat','files','review'][+e.key-1]);return;}
  if(e.target.id==='prompt'&&e.key==='Enter'){e.preventDefault();send();}
  if(e.target.id==='editor'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();act('save');}
  if(e.code==='KeyO'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();protect(()=>{state.closed=true;render();});}
});
$('cancel').onclick=dismiss;$('confirm').onclick=()=>{const next=onConfirm;dismiss();next?.();};
$('importBtn').onclick=()=>$('themeFile').click();
$('themeFile').onchange=async e=>{await importTheme(e.target.files[0]);e.target.value='';};
$('advance').onclick=finish;
$('restart').onclick=()=>protect(()=>init('start'));
$('brand').innerHTML=logo+'<b>P2S</b>';
$('worldTitle').innerHTML=icon('eye')+'世界预览';
useTheme(savedTheme()||catalog.default,false);resize();init(entry);
window.addEventListener('resize',()=>{resize();world();});
</script></body></html>
