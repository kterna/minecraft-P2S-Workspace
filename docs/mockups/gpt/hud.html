<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面板 HUD · 松脊营地 · P2S</title>
<style>* {box-sizing:border-box}
[hidden] {display:none!important}
html,body {margin:0;min-height:100%}
body {padding:16px 0;background:var(--backdrop);color:var(--text);font:14px/1.35 'WenQuanYi Zen Hei','Microsoft YaHei',sans-serif}
button,a,input,textarea {font:inherit}
button,a {color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button {border:0;background:transparent;padding:0}
a {text-decoration:none}
button:disabled {cursor:default}
button,a,summary {position:relative}
button:not(:disabled):after,a:after,summary:after {content:'';position:absolute;inset:0;pointer-events:none;transition:background-color 100ms linear}
button:not(:disabled):hover:after,a:hover:after,summary:hover:after {background:var(--hover)}
button:not(:disabled):active:after,a:active:after,summary:active:after {background:var(--pressed)}
:focus-visible {outline:1px solid var(--focus);outline-offset:-1px}
@media(prefers-reduced-motion:reduce){button:after,a:after,summary:after{transition:none!important}}
.sheet {width:max-content;max-width:100%;margin:auto}
.sheethead,.sheetnav,.sheetfoot,.themebar {display:flex;align-items:center;flex-wrap:wrap;color:var(--muted)}
.sheethead {gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line)}
.sheethead strong {font-size:16px;letter-spacing:.03em;color:var(--text)}
.sheethead .dims {margin-left:auto;font:12px monospace;color:var(--faint)}
.sheetnav {gap:3px;margin:5px 0}
.sheetnav a,.sheetfoot button,.import {padding:4px 8px}
.sheetnav a[aria-current] {color:var(--accent);background:var(--selected)}
.themebar {gap:4px;padding:0 0 8px}
.themebar .import {margin-left:auto;font-size:12px}
.palettes,.menu-palettes {display:flex;flex-wrap:wrap;gap:2px}
.palette {display:flex;align-items:center;gap:5px;padding:3px 6px;color:var(--muted);border-bottom:1px solid transparent;white-space:nowrap}
.palette[aria-pressed=true] {color:var(--text);border-color:var(--accent);background:var(--selected)}
.sample {width:15px;height:10px;display:inline-flex;background:var(--sw-panel);border:1px solid var(--sw-line);align-items:flex-end;justify-content:flex-end}
.sample i {width:7px;height:5px;background:var(--sw-accent)}
.sheetfoot {gap:8px;margin:5px 0 0;font-size:13px}
.sheetfoot button:first-child {padding-left:0}
#importMessage {color:var(--info)}
#frame {position:relative;overflow:hidden;background:var(--panel)}
.game {position:absolute;inset:0 auto auto 0;transform-origin:top left;width:640px;height:360px;font:10px/11px 'Unifont','WenQuanYi Zen Hei Sharp','Microsoft YaHei',monospace;background:var(--panel);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.game.small {width:480px;height:270px}
.icon {display:inline-block;width:9px;height:9px;flex:none;vertical-align:middle;shape-rendering:crispEdges}
.row,.tag,.btn,.tab,.userhead,.agenthead,.keyhint,.logo,.topbar,.flat,.sessionhead,.subhead,.tracetop,.cardtop,.toolhead,.planline,.actionline {display:flex;align-items:center}
.gap {gap:5px}.grow {flex:1;min-width:0}.muted {color:var(--muted)}.accent,.flat.action {color:var(--accent)}.good {color:var(--success)}.bad {color:var(--danger)}
.tiny,.clock,.keyhint,.time {font-size:8px;line-height:9px}
.clock,.time {color:var(--faint)}
.tag,.flat {gap:4px;font-size:9px;line-height:10px}.flat {color:var(--muted)}
.topbar {height:21px;flex:none;gap:6px;padding:0 7px;background:var(--inset);border-bottom:1px solid var(--line);position:relative;z-index:3}
.logo {gap:4px;color:var(--accent)}.logo b {font: bold 18px/18px 'Unifont',monospace}.logo svg {width:13px;height:13px}
.slash,.minor {color:var(--faint)}.minor,.switch {font-size:9px}
.switch,.more,.close-panel {display:flex;align-items:center;justify-content:center;height:15px;padding:0 4px}
.switch {margin-left:auto;color:var(--muted);gap:3px}.switch i {width:5px;height:5px;background:var(--accent)}
.more {font-size:14px;min-width:18px;border:1px solid var(--line);background:var(--raised)}
.more[aria-expanded=true] {background:var(--selected);border-color:var(--focus)}
.close-panel {color:var(--muted)}
.pop {position:absolute;right:6px;top:calc(100% + 2px);width:116px;padding:3px;background:var(--raised);border:1px solid var(--input-border)}
.pop h2 {font-size:9px;line-height:11px;color:var(--muted);font-weight:normal;margin:0;padding:3px 4px;border-bottom:1px solid var(--line)}
.popitem {width:100%;display:flex;gap:6px;padding:3px 4px;align-items:center;text-align:left;font-size:9px;line-height:10px}
.popitem .end {margin-left:auto;color:var(--faint)}.popitem:disabled {color:var(--faint)}
.popgroup+.popgroup {border-top:1px solid var(--line);margin-top:2px;padding-top:2px}
.menu-palettes {display:grid;grid-template-columns:1fr 1fr;margin-top:2px}.menu-palettes .palette {font-size:9px;padding:3px}.menu-palettes .sample {width:10px;height:7px}
.work {display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.dock,.view,.deskwrap,.codepane,.world {min-height:0;min-width:0;display:flex;flex-direction:column}
.dock {border-right:1px solid var(--line)}.view,.deskwrap {flex:1}
.tabs {height:20px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:3px;padding-left:6px}
.tab {gap:4px;padding:0 7px;color:var(--muted);font-size:10px;border-bottom:1px solid transparent}
.tab[aria-current] {color:var(--accent);border-color:var(--accent)}
.count {background:var(--selected);color:var(--accent);font-size:8px;line-height:9px;min-width:10px;padding:0 2px;text-align:center}
.scroll {min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
.chatlog {flex:1;padding:5px 8px}
.sessionhead {gap:5px;margin-bottom:4px}
.sessionhead h1 {margin:0;font-weight:normal;font-size:9px;line-height:12px}
.sessionmeta {font-size:8px;color:var(--faint);margin-left:auto}
.userbox {background:var(--raised);border-left:1px solid var(--input-border);padding:3px 5px;margin-bottom:4px}
.userhead {font-size:8px;line-height:9px;gap:3px;color:var(--muted)}
.userbox p,.agentcopy {font-size:9px;line-height:11px;margin:1px 0;overflow-wrap:anywhere}
.agentline {display:flex;gap:4px;align-items:flex-start}
.avatar {width:13px;height:13px;flex:none;background:var(--selected);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.agenthead {color:var(--accent);gap:5px;height:10px;font-size:9px}.agentcopy {margin:2px 0 4px}
.trace,.reviewcard,.reviewlist {border:1px solid var(--line);background:var(--inset)}
.tracetop,.cardtop {gap:4px;padding:3px 5px;background:var(--raised);border-bottom:1px solid var(--line);font-size:9px}
.tracetop .clock,.cardtop .clock {margin-left:auto}
.meter {display:flex;gap:2px}.meter i {height:3px;width:7px;background:var(--line)}.meter i.lit {background:var(--accent)}
.tracebody {padding:1px 5px 3px}.toolhead,.planline {gap:4px;min-height:13px;font-size:9px;line-height:10px}
details>summary {cursor:pointer;list-style:none}summary::-webkit-details-marker {display:none}
.twisty {font-size:8px;width:6px}.twisty:before {content:'▸'}details[open]>summary .twisty:before {content:'▾'}
details[open]>summary {color:var(--text)}
.planline {color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:1px}
.planline .clock,.toolhead .time {margin-left:auto}
.thought,.branch {margin:0 0 2px 4px;padding:1px 0 1px 7px;border-left:1px solid var(--line);font-size:9px;line-height:11px;color:var(--muted)}
.branch>div {display:flex;gap:4px;align-items:center;min-height:11px}
.branch small {font-size:8px}.branch .reason {padding-left:13px;color:var(--tool-failed)}
.toolhead .name {min-width:56px}.toolhead .desc {color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done {color:var(--tool-done)}.running {color:var(--tool-running)}.waiting {color:var(--tool-waiting)}.failed {color:var(--tool-failed)}
.current {background:var(--selected);border-left:1px solid var(--tool-running);padding-left:3px;margin-left:-4px}
.runtools,.cardaction,.queue,.actions {display:flex;align-items:center;gap:5px}
.runtools {margin:4px 0 0;color:var(--muted)}
.btn {justify-content:center;gap:3px;background:var(--raised);border:1px solid var(--line);padding:2px 5px;min-height:15px;white-space:nowrap;font-size:9px;line-height:9px}
.btn.primary {background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger {color:var(--danger)}
.composer {flex:none;margin:2px 8px 5px}
.entry {display:flex;align-items:center;gap:4px;padding:2px 3px 2px 5px;border:1px solid var(--input-border);background:var(--input-bg);min-height:21px}
.entry:focus-within {border-color:var(--focus)}.entry .prompt {color:var(--accent);font-size:12px}
.entry input {width:0;flex:1;background:transparent;border:0;color:var(--text);font-size:9px;outline:0}
.entry input::placeholder {color:var(--faint);opacity:1}
.queue-list {max-height:43px;margin-bottom:2px}
.queue {min-height:13px;font-size:9px;color:var(--muted);line-height:10px}
.queue b {color:var(--info);font-weight:400}.queue .queued-text {flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.foot {height:13px;flex:none;padding:0 7px;display:flex;align-items:center;gap:6px;background:var(--inset);border-top:1px solid var(--line);color:var(--muted);font-size:8px;line-height:9px}
.foot .status {display:flex;align-items:center;gap:4px}.foot .push {margin-left:auto}#feedback {color:var(--info)}
.keyhint {gap:3px}kbd {font:inherit;border:1px solid var(--line);padding:0 2px}
.world {position:relative;overflow:hidden}
.land {position:relative;flex:1;min-height:0}
#art {position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 58%;image-rendering:pixelated}
.glass {position:absolute;background:var(--overlay);color:var(--on-overlay);text-shadow:1px 1px var(--text-shadow)}
.compass {top:6px;left:50%;transform:translateX(-50%);padding:2px 4px;font-size:8px;line-height:8px;white-space:nowrap}
.mode {left:6px;top:6px;display:flex;gap:3px;align-items:center;padding:3px 4px;font-size:8px;line-height:9px}
.worldhud {bottom:6px;left:6px;padding:3px 5px;border-left:1px solid var(--preview-file)}
.worldhud b {font-size:9px;font-weight:normal}.coords {display:block;font-size:8px;line-height:9px}
.poi {display:flex;gap:3px;align-items:center;padding:2px 3px;font-size:8px;border-left:2px solid var(--preview-file)}
.poi:before {content:'';position:absolute;right:100%;bottom:-4px;width:6px;height:4px;border-left:1px solid var(--preview-file);border-top:1px solid var(--preview-file)}
.camera {bottom:6px;right:6px;display:flex;gap:4px;align-items:center;padding:3px 4px;font-size:8px;line-height:9px}
.camera span {display:flex;gap:2px;align-items:center}.camera span+span {padding-left:4px;border-left:1px solid currentColor}
.preview-key {left:6px;bottom:31px;padding:2px 4px;display:flex;gap:5px;font-size:8px}
.addmark,.delmark {display:inline-block;width:5px;height:5px;vertical-align:middle;background:var(--preview-add)}.delmark {background:transparent;border:1px solid var(--preview-remove)}
.hud {right:7px;top:7px;min-width:86px;padding:5px 6px;border-left:2px solid var(--preview-file);font-size:9px;text-align:left;line-height:11px}
.hud strong,.hud span {display:flex;align-items:center;gap:4px}.hud span {margin-top:3px;font-size:8px}.hud kbd {margin-left:auto;border-color:currentColor}
.game.closed .dock,.game.closed .topbar,.game.closed .foot,.game.closed .mode,.game.closed .worldhud,.game.closed .camera,.game.closed .poi,.game.closed .preview-key {display:none}
.game.closed .work {display:flex}.game.closed .world {flex:1}
.sprite {width:14px;height:14px;flex:none;vertical-align:middle}
.cardtop {color:var(--accent)}.frow {width:100%;display:flex;align-items:center;gap:4px;padding:2px 4px;min-height:18px;text-align:left}
.frow+.frow {border-top:1px solid var(--line)}.frow .stat {font-size:8px;margin-left:auto;white-space:nowrap}
.filekey {font-size:10px}.filenote {font-size:9px;color:var(--muted)}.warn {color:var(--warning)}
.cardaction {justify-content:space-between;padding:3px 5px;border-top:1px solid var(--line);color:var(--muted);font-size:8px}
.deskwrap {padding:6px 8px}.desktitle {margin:0 0 2px;font-size:18px;line-height:18px}
.deskintro {color:var(--muted);font-size:9px;line-height:11px;margin-bottom:4px}
.reviewlist {flex:none}.selected {background:var(--selected);box-shadow:inset 1px 0 var(--accent);color:var(--accent)}
.reviewinfo {flex:1;min-height:0;margin-top:5px}
.subhead {gap:4px;margin:1px 0 3px;font-size:10px;line-height:12px}
.summary {color:var(--muted);font-size:9px;line-height:11px;margin:0 0 4px}
.spec {display:flex;gap:14px;align-items:center;background:var(--raised);border:1px solid var(--line);padding:3px 5px;font-size:10px}
.spec small {display:block;color:var(--muted);font-size:8px;line-height:9px}.mat {display:flex;align-items:center;gap:4px}.mat .sprite {width:18px;height:18px}
.parts {display:flex;flex-wrap:wrap;gap:3px 8px;color:var(--muted);padding:3px 0;font-size:9px;line-height:11px}.parts b {font-weight:normal;color:var(--text)}
.validation {font-size:9px;line-height:11px;margin:1px 0 4px;display:flex;gap:3px;align-items:baseline}
.diff {border:1px solid var(--line);background:var(--inset);margin-bottom:2px}
.diff summary {font-size:9px;padding:3px 5px;display:flex;align-items:center;gap:3px}.diff summary small {margin-left:auto;color:var(--faint);font-size:8px}
.diff .summary {margin:0;padding:4px 5px;border-top:1px solid var(--line)}
.patch {overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent;font:9px/12px 'Unifont',monospace}
.patch div {white-space:pre;width:max-content;min-width:100%;padding:0 4px}.plus {color:var(--diff-add-text);background:var(--diff-add-bg)}.minus {color:var(--diff-remove-text);background:var(--diff-remove-bg)}
.patch .context {color:var(--muted)}.patch .omitted {color:var(--faint);font-size:8px}
.actions {flex:none;margin-top:3px;padding-top:4px;border-top:1px solid var(--line)}.actions .flat:last-child {margin-left:auto}
.explorer {position:relative;display:grid;grid-template-columns:78px 1fr;flex:1;min-height:0;border:1px solid var(--line);background:var(--inset)}
.filelist {border-right:1px solid var(--line);min-width:0}
.treehead,.codehead {font-size:9px;line-height:11px;padding:3px 4px;color:var(--muted);background:var(--raised);border-bottom:1px solid var(--line);display:flex;gap:3px;align-items:center}
.treebtn {display:flex;width:100%;padding:4px 2px;gap:2px;align-items:center;text-align:left;font-size:9px}
.codehead {justify-content:space-between}.codehead b {font-weight:400;color:var(--text)}
.codelines,.editor {font:9px/11px 'Unifont',monospace;white-space:pre;tab-size:2;flex:1}
.codelines {padding:3px 0}.codelines div {min-width:max-content}.codelines i {display:inline-block;font-style:normal;text-align:right;width:13px;margin-right:4px;color:var(--faint)}
.sectionkey {color:var(--accent)}.string {color:var(--muted)}
.editor {resize:none;min-height:0;width:100%;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);padding:3px}
.modalwrap {position:absolute;inset:0;display:grid;place-items:center;background:var(--overlay);z-index:4}
.dialog {width:222px;background:var(--panel);border:1px solid var(--focus);padding:9px}.dialog h2 {font-size:9px;margin:0 0 4px}.dialog p {font-size:10px;line-height:12px;margin:0 0 7px}
.followup,.notehistory {margin-top:4px;padding:3px 5px;background:var(--raised);border-left:1px solid var(--accent);font-size:9px;line-height:11px;overflow-wrap:anywhere}
.followup p {margin:1px 0 3px}.notehistory {color:var(--muted)}
.mobilelist {display:none}
.small .work {grid-template-columns:244px 1fr}.small .topbar {height:18px}.small .tabs {height:17px}.small .tab {padding:0 5px}
.small .desktitle {font-size:9px;line-height:11px}.small .chatlog,.small .deskwrap {padding:4px 6px}.small .toolhead,.small .planline {min-height:11px}.small .composer {margin:1px 6px 3px}.small .entry {min-height:18px;padding:1px 2px 1px 4px}
.small .foot {height:11px}.small .foot .extra {display:none}.small .filelist {display:none}
.small .filelist.open {display:block;position:absolute;inset:0 auto 0 0;width:86px;background:var(--panel);z-index:1}
.small .explorer {grid-template-columns:1fr}.small .mobilelist {display:inline-flex}
.small .frow {min-height:15px;padding:1px 3px}.small .reviewinfo {margin-top:3px}.small .sprite {width:12px;height:12px}
@media(max-width:680px){body{padding:6px 0}.sheethead,.sheetnav,.themebar,.sheetfoot{padding-left:4px;padding-right:4px;font-size:12px}.sheetnav a,.palette{padding:3px 4px}.themebar .import{margin-left:0}}

</style></head>
<body data-scene="hud">
<main class="sheet" id="sheet">
<header class="sheethead"><strong>Prompt2Structure</strong><span>/</span><span>建造工作台</span><span class="dims" id="dimensions"></span></header>
<nav class="sheetnav" aria-label="样稿目录"><a href="index.html">样稿目录</a>
<a href="running.html">运行中</a>
<a href="pending.html">待审卡片</a>
<a href="review.html">逐份审阅</a>
<a href="files.html">工作区文件</a>
<a href="narrow.html">窄屏</a>
<a href="hud.html" aria-current="page">面板 HUD</a>
<a href="running.html?menu=open">更多菜单</a></nav>
<div class="themebar"><div class="palettes" id="palettes" role="group" aria-label="主题"></div><button id="importBtn" class="import">载入主题 JSON</button><input type="file" accept=".json,application/json" id="themeFile" hidden></div>
<div id="frame"><section id="game" class="game" aria-label="Minecraft 内的 P2S 工作台">
<div id="underlay" style="display:contents">
<header class="topbar"><span class="logo" id="brand" aria-label="P2S"></span><span class="slash">/</span><strong>松脊营地</strong><span class="slash">/</span><span class="minor">lookout</span><button class="switch" type="button" data-act="appearance" aria-controls="pop"><i></i><span id="themeName"></span></button><button class="more" id="more" data-act="more" aria-label="更多菜单" aria-controls="pop" aria-expanded="false">⋯</button><button class="close-panel" data-act="close" aria-label="收起面板（O）">×</button><section class="pop" id="pop" hidden aria-label="工作台菜单"></section></header>
<div class="work"><section class="dock"><nav id="tabs" class="tabs" aria-label="工作台视图"></nav><div id="view" class="view"></div></section>
<aside class="world" aria-label="游戏世界"><div class="land"><canvas id="art" role="img" aria-label="松脊营地西坡、云杉林与山脊瞭望塔的像素预览"></canvas><button id="worldmode" class="mode glass" data-act="preview"></button><span class="compass glass" aria-label="面向西北">W · ┊ NW ┊ · N</span><span class="poi glass" id="poi" hidden></span><span class="preview-key glass" id="legend" hidden></span><div class="worldhud glass"><b id="placename"></b><span class="coords">XYZ　128 / 78 / −64</span></div><div class="camera glass" id="camera" aria-label="3D 预览控件位置示意"></div><button class="hud glass" hidden id="hud" data-act="open" aria-label="打开 Agent 工作台"></button></div></aside></div>
<footer class="foot"><span id="status" class="status"></span><span id="feedback" role="status"></span><span class="push"></span><span id="hotkeys" class="row gap"></span></footer></div>
<div class="modalwrap" id="modal" hidden><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogText"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="row gap"><button class="btn" id="cancel">返回</button><button class="btn danger" id="confirm"></button></div></section></div>
</section></div><div class="sheetfoot"><button id="restart">↺ 从发起开始</button><button id="advance">推进演示：生成完成 →</button><span id="importMessage" role="status"></span></div></main>

    }

    const merged=new Map(colors.themes.map(t=>[t.id,t]));
    for(const t of data.themes)merged.set(t.id,data.version===1?upgradeLegacy(t):t);

// Compare the actual two revisions. Skip common edges before matching interior lines.
function diffLines(before,after){
  const a=before?before.split('\n'):[],b=after?after.split('\n'):[];
  let first=0,ae=a.length,be=b.length;
  while(first<ae&&first<be&&a[first]===b[first])first++;
  while(ae>first&&be>first&&a[ae-1]===b[be-1]){ae--;be--;}
  const rows=[];
  if(first>0)rows.push(['context',a[first-1]]);
  let i=first,j=first;
  const n=ae-first,m=be-first;
  // Large pasted files can always be represented as one replacement hunk.
  if(n*m<=150000&&n&&m){
    const lcs=Array.from({length:n+1},()=>new Uint32Array(m+1));
    for(let x=n-1;x>=0;x--)for(let y=m-1;y>=0;y--)
      lcs[x][y]=a[x+first]===b[y+first]?1+lcs[x+1][y+1]:Math.max(lcs[x+1][y],lcs[x][y+1]);
    while(i<ae&&j<be){
      if(a[i]===b[j]){rows.push(['context',a[i++]]);j++;}
      else if(lcs[i-first+1][j-first]>=lcs[i-first][j-first+1])rows.push(['minus',a[i++]]);
      else rows.push(['plus',b[j++]]);
    }
  }
  while(i<ae)rows.push(['minus',a[i++]]);
  while(j<be)rows.push(['plus',b[j++]]);
  if(ae<a.length)rows.push(['context',a[ae]]);
  return rows;
}

function act(action){
  if(!$('modal').hidden)return;
  const [a,v]=action.split(':');
  if(a==='tab') {
    if(state.tab!==v)protect(()=>changeTab(v));
  }else if(a==='pick') {select(+v);changeTab('review');}
  else if(a==='file')protect(()=>{select(+v);render();});
  else if(a==='tree'){state.fileDrawer=!state.fileDrawer;render();}
  else if(a==='firstReview'){const i=state.statuses.indexOf('pending');select(Math.max(0,i));changeTab('review');}
  else if(a==='inspectFile')changeTab('files');
  else if(a==='stop'){if(state.activeNote)state.notePaused=true;else state.phase='stopped';state.notice='已停止当前运行';render();}
  else if(a==='resume'){if(state.activeNote)state.notePaused=false;else state.phase='running';state.notice='重新运行';render();}
  else if(a==='send')send();
  else if(a==='apply')decide('applied');
  else if(a==='discard')ask('丢弃 '+files[state.selected].key+'？','这份提案的预览会撤下。其他文件仍可继续审阅。','丢弃此文件',()=>decide('discarded'));
  else if(a==='edit'){state.editing=true;state.editText=state.statuses[state.selected]==='pending'?state.proposed[state.selected]:state.saved[state.selected];render('editor');}
  else if(a==='save'){

    rememberDecision();
    if(state.statuses[i]!=='pending')state.base[i]=state.saved[i];
    state.proposed[i]=state.editText;state.statuses[i]='pending';state.phase='ready';state.manual.add(i);state.editing=false;state.tab='review';state.notice='手改已存为待审';render();
  }
  else if(a==='cancelEdit')protect(()=>render());
  else if(a==='withdraw'){rememberScroll();state.queue.splice(+v,1);state.notice='已撤回排队消息';render('prompt');}
  else if(a==='palette'){
    const fromMenu=state.menu==='appearance';
    useTheme(catalog.themes[+v].id);world();
    (fromMenu?$('pop'):$('palettes')).querySelector('[aria-pressed=true]')?.focus();
  }
  else if(a==='more'||a==='moreHome'||a==='menu'||a==='appearance'){
    const page=a==='menu'?v:a==='appearance'?'appearance':'more';
    state.menu=state.menu===page&&a!=='moreHome'?'':page;drawMenu();
    if(state.menu)$('pop').querySelector('button:not(:disabled)')?.focus();else $('more').focus();
  }
  else if(a==='close')protect(()=>{state.closed=true;state.menu='';render();$('hud').focus();});
  else if(a==='diagnostics'){downloadDiagnostics();closeMenu(true);}
  else if(a==='checkpoint'){state.checkpoint=checkpointState();state.notice='已保存工作区检查点';closeMenu(true);render();}
  else if(a==='restore'&&state.checkpoint)protect(()=>ask('恢复工作区检查点？','将恢复保存时的文件和审阅决定。','恢复',()=>{
    rememberDecision();restoreDecision(state.checkpoint);closeMenu(true);render();}));
  else if(a==='undo'||a==='redo'){
    const [from,to]=a==='undo'?[state.past,state.future]:[state.future,state.past];
    if(from.length)protect(()=>{to.push(checkpointState());restoreDecision(from.pop());closeMenu(true);render();});
  }
  else if(a==='preview'){state.preview=!state.preview;world();drawMenu();}
  else if(a==='open'){state.closed=false;render();$('more').focus();}
}
function back(){
  if(!$('modal').hidden){dismiss();return;}
  if(state.menu){closeMenu(true);return;}
  if(state.closed)return;
  if(state.editing){act('cancelEdit');return;}
  if(state.fileDrawer){state.fileDrawer=false;render();return;}
  if(document.activeElement===$('prompt')){document.activeElement.blur();return;}
  if(state.tab!=='chat'){changeTab('chat');return;}
  state.closed=true;render();$('hud').focus();
}
function resize(){
  const small=entry==='narrow'||window.innerWidth<760;
  const w=small?480:640,h=small?270:360;
  const scale=Math.min(2,document.documentElement.clientWidth/w);
  $('game').classList.toggle('small',small);$('game').style.transform='scale('+scale+')';
  $('frame').style.width=w*scale+'px';$('frame').style.height=h*scale+'px';
  $('sheet').style.width=w*scale+'px';$('dimensions').textContent=w+' × '+h+'  /  '+Number(scale.toFixed(2))+'×';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(state.menu&&!e.target.closest('#pop,#more,.switch'))closeMenu();
  if(b)act(b.dataset.act);
});
document.addEventListener('toggle',e=>{
  if(!e.target.matches('details[data-fold]')||!e.target.isConnected)return;
  if(e.target.open)state.folds.add(e.target.dataset.fold);
  else state.folds.delete(e.target.dataset.fold);
},true);
document.addEventListener('input',e=>{
  if(e.target.id==='prompt'){state.draft=e.target.value;}
  if(e.target.id==='editor')state.editText=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(!$('modal').hidden){
    if(e.key==='Escape'){e.preventDefault();dismiss();}
    if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('cancel')?$('confirm'):$('cancel')).focus();}return;
  }
  if(e.key==='Escape'){e.preventDefault();back();return;}
  if(state.closed){if(e.code==='KeyO'){e.preventDefault();act('open');}return;}
  if(e.altKey&&['1','2','3'].includes(e.key)){e.preventDefault();act('tab:'+['chat','files','review'][+e.key-1]);return;}
  if(e.target.id==='prompt'&&e.key==='Enter'){e.preventDefault();send();}
  if(e.target.id==='editor'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();act('save');}
  if(e.code==='KeyO'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();act('close');}
});
$('cancel').onclick=dismiss;$('confirm').onclick=()=>{const next=onConfirm;dismiss();next?.();};
$('importBtn').onclick=()=>$('themeFile').click();
$('themeFile').onchange=async e=>{await importTheme(e.target.files[0]);e.target.value='';};
$('advance').onclick=finish;
$('restart').onclick=()=>protect(()=>init('start'));
$('brand').innerHTML=logo+'<b>P2S</b>';
$('camera').innerHTML=[['rotate','旋转'],['zoom','缩放'],['reset','复位']].map(([ic,label])=>'<span aria-disabled="true" title="3D 预览控件示意">'+icon(ic)+label+'</span>').join('');
useTheme(savedTheme()||catalog.default,false);resize();init(entry);
if(entry==='running'&&state.menu==='more'){
  document.querySelector('.sheetnav [aria-current]')?.removeAttribute('aria-current');
  document.querySelector('.sheetnav a[href*="?menu"]').setAttribute('aria-current','page');
  document.title='更多菜单 · 松脊营地 · P2S';
}
window.addEventListener('resize',()=>{resize();world();});
</script></body></html>
