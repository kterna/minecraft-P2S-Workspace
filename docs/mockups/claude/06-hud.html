<style>
html,body{margin:0;background:#161616;color:#d8d8d8;font:14px/1.5 system-ui,'Noto Sans CJK SC',sans-serif}

<script>
const THEMES = {"midnight": {"schema": 1, "id": "midnight", "name": "深夜", "colors": {"panelBg": "#0B111BE8", "panelEdge": "#2B3A50", "headerBg": "#0E1623F2", "runBarBg": "#101B2CF2", "tabBarBg": "#0C1320E8", "tabActiveBg": "#17243A", "tabText": "#8394AE", "tabTextActive": "#EEF3FA", "surface": "#111A27F0", "surfaceHi": "#1A273B", "border": "#27364C", "divider": "#1C283A", "selection": "#62B6F240", "text": "#E3EAF4", "textMuted": "#9CABC0", "textDim": "#64748C", "accent": "#62B6F2", "accentText": "#06121F", "userBubble": "#182A44", "userBorder": "#2F4C73", "userText": "#EAF2FF", "assistantText": "#D8E1ED", "toolVerb": "#8DB7E2", "thinkingText": "#7686A0", "ok": "#6CD48E", "warn": "#F2C25B", "danger": "#F2786B", "pending": "#F0A65A", "pendingBg": "#261D14F0", "diffAddBg": "#12301D", "diffAddText": "#9DE6B2", "diffDelBg": "#3A181B", "diffDelText": "#F5A9A4", "gutterText": "#4E5E75", "inputBg": "#060B13F2", "inputText": "#E3EAF4", "inputBorder": "#2B3A50", "inputBorderFocus": "#62B6F2", "placeholder": "#56667E", "caret": "#EEF3FA", "buttonBg": "#17233A", "buttonBorder": "#33455F", "buttonText": "#DCE5F0", "primaryBg": "#2869A0", "primaryBorder": "#62B6F2", "primaryText": "#FFFFFF", "dangerBg": "#3A1B1E", "dangerBorder": "#B05850", "dangerText": "#FFD7D2", "bevelHi": "#FFFFFF14", "bevelLo": "#00000050", "badgeBg": "#F0A65A", "badgeText": "#1A1206", "synKey": "#8FC3F0", "synString": "#A8DDA0", "synNumber": "#F2C98A", "synSection": "#D2B2F5", "synComment": "#5C6D85", "hudBg": "#0B111BCC", "hudText": "#E3EAF4"}, "metrics": {"panelWidth": 0.54, "minPanelWidth": 300, "pad": 6, "lineHeight": 10, "textShadow": true, "buttonTextShadow": true}}, "contrast": {"schema": 1, "id": "contrast", "name": "高对比", "colors": {"panelBg": "#000000FA", "panelEdge": "#FFFFFF", "headerBg": "#000000", "runBarBg": "#000000", "tabBarBg": "#000000", "tabActiveBg": "#FFFFFF", "tabText": "#FFFFFF", "tabTextActive": "#000000", "surface": "#000000", "surfaceHi": "#262626", "border": "#FFFFFF", "divider": "#9A9A9A", "selection": "#FFE60066", "text": "#FFFFFF", "textMuted": "#EDEDED", "textDim": "#CFCFCF", "accent": "#FFE600", "accentText": "#000000", "userBubble": "#000000", "userBorder": "#FFE600", "userText": "#FFFFFF", "assistantText": "#FFFFFF", "toolVerb": "#7FDBFF", "thinkingText": "#D6D6D6", "ok": "#3CFF7A", "warn": "#FFE600", "danger": "#FF6B6B", "pending": "#FFB000", "pendingBg": "#000000", "diffAddBg": "#003D14", "diffAddText": "#8CFFAE", "diffDelBg": "#520000", "diffDelText": "#FFC2C2", "gutterText": "#CFCFCF", "inputBg": "#000000", "inputText": "#FFFFFF", "inputBorder": "#FFFFFF", "inputBorderFocus": "#FFE600", "placeholder": "#BDBDBD", "caret": "#FFE600", "buttonBg": "#000000", "buttonBorder": "#FFFFFF", "buttonText": "#FFFFFF", "primaryBg": "#FFE600", "primaryBorder": "#FFE600", "primaryText": "#000000", "dangerBg": "#000000", "dangerBorder": "#FF6B6B", "dangerText": "#FF8A8A", "bevelHi": "#00000000", "bevelLo": "#00000000", "badgeBg": "#FFE600", "badgeText": "#000000", "synKey": "#7FDBFF", "synString": "#8CFFAE", "synNumber": "#FFE600", "synSection": "#FFB8FF", "synComment": "#CFCFCF", "hudBg": "#000000F0", "hudText": "#FFFFFF"}, "metrics": {"panelWidth": 0.54, "minPanelWidth": 300, "pad": 6, "lineHeight": 11, "textShadow": false, "buttonTextShadow": false}}, "stone": {"schema": 1, "id": "stone", "name": "原版石板", "colors": {"panelBg": "#C6C6C6F7", "panelEdge": "#000000", "headerBg": "#C6C6C6", "runBarBg": "#B5B5B5", "tabBarBg": "#9A9A9A", "tabActiveBg": "#C6C6C6", "tabText": "#3A3A3A", "tabTextActive": "#1E1E1E", "surface": "#B9B9B9", "surfaceHi": "#DADADA", "border": "#555555", "divider": "#8B8B8B", "selection": "#2F5E8F55", "text": "#262626", "textMuted": "#474747", "textDim": "#6B6B6B", "accent": "#2F5E8F", "accentText": "#FFFFFF", "userBubble": "#E4E4E4", "userBorder": "#555555", "userText": "#1E1E1E", "assistantText": "#262626", "toolVerb": "#2F5E8F", "thinkingText": "#6B6B6B", "ok": "#2E7D32", "warn": "#8A6100", "danger": "#B3261E", "pending": "#A85400", "pendingBg": "#E7D8BE", "diffAddBg": "#BFE3C3", "diffAddText": "#1D5824", "diffDelBg": "#EDC4C0", "diffDelText": "#7A1D16", "gutterText": "#6B6B6B", "inputBg": "#000000", "inputText": "#E0E0E0", "inputBorder": "#A0A0A0", "inputBorderFocus": "#FFFFFF", "placeholder": "#707070", "caret": "#D0D0D0", "buttonBg": "#727272", "buttonBorder": "#000000", "buttonText": "#FFFFFF", "primaryBg": "#3D6C9C", "primaryBorder": "#000000", "primaryText": "#FFFFFF", "dangerBg": "#8E3A33", "dangerBorder": "#000000", "dangerText": "#FFFFFF", "bevelHi": "#FFFFFF66", "bevelLo": "#00000066", "badgeBg": "#A85400", "badgeText": "#FFFFFF", "synKey": "#1F4F80", "synString": "#2E6B2E", "synNumber": "#8A5A00", "synSection": "#6A2E8A", "synComment": "#6B6B6B", "hudBg": "#000000A0", "hudText": "#FFFFFF"}, "metrics": {"panelWidth": 0.54, "minPanelWidth": 300, "pad": 6, "lineHeight": 10, "textShadow": false, "buttonTextShadow": true}}};
const S = 2;
function hexOk(v){return /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(v)}
function params(){const p=new URLSearchParams(location.hash.slice(1));return {t:p.get('t')||'midnight',s:p.get('s')||''}}
function setHash(t,s){const p=new URLSearchParams();p.set('t',t);if(s)p.set('s',s);history.replaceState(null,'','#'+p.toString());}
function applyTheme(id){
  const th=THEMES[id]||THEMES.midnight, st=document.querySelector('.stage');
  for(const [k,v] of Object.entries(th.colors)){ if(hexOk(v)) st.style.setProperty('--'+k,v); }
  const m=th.metrics, W=+st.dataset.w;
  const pw=Math.max(m.minPanelWidth, Math.round(W*m.panelWidth));
  st.dataset.panel=st.dataset.fixedpanel||pw;
  st.style.setProperty('--panelW',(+st.dataset.panel)*S+'px');
  st.style.setProperty('--pad',m.pad*S+'px');
  st.style.setProperty('--lineHeight',m.lineHeight*S+'px');
  const sh=`${S}px ${S}px 0 color-mix(in srgb, currentColor 25%, #000)`;
  st.style.setProperty('--textShadow',m.textShadow?sh:'none');
  st.style.setProperty('--buttonTextShadow',m.buttonTextShadow?sh:'none');
  document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===id));
  document.getElementById('json').textContent=JSON.stringify(th,null,2);
  drawWorld();
}
function setState(s){
  const st=document.querySelector('.stage');
  st.className=st.className.replace(/\bst-\w+/g,'').trim();
  if(s) st.classList.add('st-'+s);
  document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===s));
}
function syncLinks(){const {t}=params();document.querySelectorAll('a[data-page]').forEach(a=>a.href=a.dataset.page+'#t='+t);}
/* ---- pixel world: side view, 1 block = 8 GUI px ---- */
function drawWorld(){
  const st=document.querySelector('.stage'), svg=st.querySelector('svg.world');
  const W=+st.dataset.w, H=+st.dataset.h, mode=st.dataset.world||'review';
  const panel=st.dataset.nopanel? 0 : +st.dataset.panel;
  const out=[]; const R=(x,y,w,h,f)=>out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`);
  const box=(x,y,w,h,f)=>{R(x,y,w,1,f);R(x,y+h-1,w,1,f);R(x,y,1,h,f);R(x+w-1,y,1,h,f)};
  let seed=7; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const B=8, gy=H-(H>300?64:48);
  // sky bands
  R(0,0,W,H,'#79A6F2'); R(0,Math.round(H*0.30),W,H,'#8DB5F6'); R(0,Math.round(H*0.48),W,H,'#A3C5F8'); R(0,gy-24,W,24,'#B7D2F9');
  // sun
  R(W-64,22,18,18,'#FFF6C2'); R(W-62,24,14,14,'#FFF0A0');
  // clouds
  [[panel+30,40,48],[panel+150,28,64],[W-150,64,40],[panel+90,86,32]].forEach(([x,y,w])=>{R(x,y,w,6,'#FFFFFF');R(x+8,y-4,w-20,4,'#FFFFFF');R(x+4,y+6,w-8,2,'#E6EEFB')});
  // far hills
  for(let x=0;x<W;x+=8){const h=16+Math.round(10*Math.sin(x/37)+8*Math.sin(x/13+1));R(x,gy-h,8,h,'#8FB0C9');}
  for(let x=0;x<W;x+=8){const h=6+Math.round(7*Math.sin(x/29+2)+4*Math.sin(x/11));R(x,gy-h,8,h,'#6E9A63');}
  // ground layers
  R(0,gy,W,3,'#7BC05A'); R(0,gy+3,W,5,'#5E9A3F'); R(0,gy+8,W,24,'#8B5E3C'); R(0,gy+32,W,H,'#7C7C7C');
  for(let x=0;x<W;x+=2){ for(let y=gy+8;y<H;y+=2){ const r=rnd(); if(r<0.10) R(x,y,2,2,y<gy+32?'#7A5032':'#6C6C6C'); else if(r>0.95) R(x,y,2,2,y<gy+32?'#9A6B47':'#8C8C8C'); } }
  for(let x=0;x<W;x+=4){ if(rnd()<0.3) R(x,gy+3,2,2,'#6DB04B'); }
  // trees
  const tree=(x)=>{R(x+6,gy-20,4,20,'#6B4A2B');R(x,gy-36,16,16,'#3F7A2F');R(x+2,gy-40,12,4,'#3F7A2F');R(x+2,gy-34,4,4,'#4E8F3A');R(x+10,gy-28,4,4,'#356A27')};
  // castle
  const cw=15*B, cx = panel + Math.max(14, Math.round((W-panel-cw)/2)) ;
  tree(cx-34); tree(cx+cw+16); if(W-panel>260) tree(cx+cw+60);
  const blk=(c,r,col)=>{const x=cx+c*B,y=gy-(r+1)*B;R(x,y,B,B,col||'#8E8E8E');R(x,y+3,B,1,'#727272');R(x,y+7,B,1,'#727272');R(x+((r%2)?2:6),y,1,3,'#727272');R(x+((r%2)?6:2),y+4,1,3,'#727272');R(x,y,B,1,'#A2A2A2')};
  for(let r=0;r<6;r++) for(let c=0;c<15;c++){ if(c>=6&&c<=8&&r<3) continue; blk(c,r); }
  for(const t0 of [0,12]) for(let r=6;r<9;r++) for(let c=t0;c<t0+3;c++) blk(c,r);
  for(const t0 of [0,12]) for(const c of [t0,t0+2]) blk(c,9);
  // gate
  R(cx+6*B,gy-3*B,3*B,3*B,'#2A2018'); R(cx+6*B+2,gy-3*B+2,3*B-4,3*B-2,'#3B2B1D'); R(cx+7*B+3,gy-3*B+2,2,3*B-2,'#2A2018');
  // tower windows
  R(cx+1*B+2,gy-8*B+2,4,6,'#1E2430'); R(cx+13*B+2,gy-8*B+2,4,6,'#1E2430');
  // old flat slab on wall top (row 6, cols 3..11)
  for(let c=3;c<12;c++){const x=cx+c*B,y=gy-7*B+4;R(x,y,B,4,'#A9A9A9');R(x,y,B,1,'#C2C2C2');}
  // preview ghosts
  const g=(c,r,fill,edge)=>{const x=cx+c*B,y=gy-(r+1)*B;R(x,y,B,B,fill);box(x,y,B,B,edge)};
  const GW='rgba(120,255,150,0.30)', GE='rgba(185,255,200,0.95)', GR='rgba(90,58,36,0.62)', GRE='rgba(210,170,120,0.95)';
  const DIM=(s)=>s.replace(/[\d.]+\)$/,m=>(parseFloat(m)*0.35).toFixed(2)+')');
  const focus = mode==='focus';
  if(mode!=='none'){
    const wallRows = mode==='running'?[6,7]:[6,7,8,9];
    for(const r of wallRows) for(let c=3;c<12;c++){ if(r===8&&(c===5||c===8||c===11)&&mode!=='running') continue; if(r===8&&(c===5||c===8)) continue; g(c,r,GW,GE); }
    if(mode!=='running'){
      const rows=[[10,3,11],[11,4,10],[12,5,9],[13,6,8],[14,7,7]];
      for(const [r,a,b] of rows) for(let c=a;c<=b;c++) g(c,r, focus?DIM(GR):GR, focus?DIM(GRE):GRE);
      // removed slab: red
      for(let c=3;c<12;c++){const x=cx+c*B,y=gy-7*B+4;R(x,y,B,4,'rgba(255,70,70,0.35)');box(x,y,B,4,'rgba(255,110,110,0.95)');}
      // gate widen
      g(9,0, focus?DIM(GW):GW, focus?DIM(GE):GE); g(9,1, focus?DIM(GW):GW, focus?DIM(GE):GE);
    } else {
      // block being placed right now
      const x=cx+9*B,y=gy-8*B; box(x-1,y-1,B+2,B+2,'#FFFFFF');
    }
    // selection box
    const sx=cx-B, sy=gy-16*B, sw=17*B, sh=16*B;
    box(sx,sy,sw,sh,'rgba(255,255,255,0.85)');
    for(const [x,y] of [[sx,sy],[sx+sw-4,sy],[sx,sy+sh-4],[sx+sw-4,sy+sh-4]]) R(x,y,4,4,'#FFFFFF');
  }
  if(st.dataset.hotbar){
    const hx=Math.round((W-182)/2), hy=H-22;
    R(hx,hy,182,22,'rgba(0,0,0,0.55)'); box(hx,hy,182,22,'#8B8B8B');
    for(let i=0;i<9;i++){box(hx+1+i*20,hy+1,20,20,'#555555'); }
    box(hx-1+0*20,hy-1,24,24,'#FFFFFF');
    const items=['#9A9A9A','#4A3222','#7BC05A','#C9A86B','#E0E0E0','#6B4A2B','#B33A3A','#D9D9D9','#7C7C7C'];
    items.forEach((c,i)=>{R(hx+5+i*20,hy+5,12,12,c);R(hx+5+i*20,hy+5,12,2,'rgba(255,255,255,0.25)')});
    const mx=Math.round(W/2), my=Math.round(H/2); R(mx-5,my,11,1,'#FFFFFF'); R(mx,my-5,1,11,'#FFFFFF');
  }
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',W*S); svg.setAttribute('height',H*S);
  svg.innerHTML=out.join('');
}
window.addEventListener('DOMContentLoaded',()=>{
  const {t,s}=params();
  document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{const p=params();setHash(b.dataset.theme,p.s);applyTheme(b.dataset.theme);syncLinks();});
  document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const p=params();setHash(p.t,b.dataset.state);setState(b.dataset.state);});
  document.getElementById('showjson').onclick=()=>document.getElementById('json').classList.toggle('show');
  const st=document.querySelector('.stage');
  setState(s|| (st.dataset.defstate||''));
  applyTheme(THEMES[t]?t:'midnight'); syncLinks();
});
</script>
</body></html>
